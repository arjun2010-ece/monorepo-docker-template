# Local run of the production image.
# In production this is replaced by Kubernetes / ECS / Fly config — the
# IMAGE is identical, only the runtime environment changes.

services:
  api:
    image: jobboard/api:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PORT: 3001
      # Which origins may call this API from a browser. Locally that's the
      # Next.js dev server; in production it's the frontend's real domain.
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
