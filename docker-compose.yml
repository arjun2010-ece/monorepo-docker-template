# Local run of the production image.
# In production this is replaced by Kubernetes / ECS / Fly config — the
# IMAGE is identical, only the runtime environment changes.

services:
  web:
    image: jobboard/web:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      # Runtime config for the Next server (server-side fetches to the API).
      # Locally, host.docker.internal reaches an API running on your machine
      # (see the backend-only branch of this repo). In production this is
      # wherever the API is deployed — an internal service DNS name.
      API_URL: http://host.docker.internal:3001
    ports:
      - "3000:3000"
